<!-- BBT-CARDS:START -->
<style id="bbt-cards">
/* ============ SITE CARDS (2026-10): compact size + colour change on hover ============ */
/* ---- compact sizes (content unchanged) ---- */
html body .k-mod.k-mod{padding:24px;border-radius:22px}
html body .k-mod.k-mod h3{font-size:1.32rem;margin:16px 0 8px}
html body .k-mod.k-mod .in{font-size:.92rem;margin-bottom:16px}
html body .k-mod.k-mod li{font-size:.9rem}
html body .k-mod.k-mod ul{gap:8px;margin-bottom:18px}
html body .k-learn.k-learn{padding:22px;border-radius:22px}
html body .k-learn.k-learn h3{font-size:1.18rem;margin:14px 0 12px}
html body .k-learn.k-learn li,html body .k-learn.k-learn p{font-size:.9rem}
html body .k-learn.k-learn .nb{width:38px;height:38px;border-radius:11px;font-size:.9rem}
html body .k-aud.k-aud{padding:22px;border-radius:20px}
html body .k-aud.k-aud h3{font-size:1.1rem;margin:16px 0 6px}
html body .k-aud.k-aud p{font-size:.9rem}
html body .k-aud.k-aud .ic{width:42px;height:42px;border-radius:12px}
html body .k-proj.k-proj{padding:24px;border-radius:22px}
html body .k-proj.k-proj h3{font-size:1.25rem;margin-top:48px}
html body .k-proj.k-proj p{font-size:.92rem}
html body .k-proj.k-proj .num{font-size:4.6rem}
html body .k-cert.k-cert,html body .k-lv.k-lv{padding:24px;border-radius:22px}
html body .k-cert.k-cert h3,html body .k-lv.k-lv h3{font-size:1.28rem}
html body .t-month.t-month{padding:clamp(22px,2.6vw,30px);border-radius:22px}
html body .t-month.t-month h3{font-size:clamp(1.35rem,1.1rem + .7vw,1.7rem);margin:10px 0 16px}
html body .t-month.t-month li{font-size:.92rem}
html body .ct-c.ct-c{padding:24px 22px 22px;border-radius:22px}
html body .ct-c.ct-c h3{font-size:1.18rem}
html body .ct-c.ct-c p{font-size:.9rem}
html body .k-fact.k-fact{padding:16px 18px;border-radius:18px}
html body .k-fact.k-fact b{font-size:1.15rem}
html body .k-roles.k-roles,html body .k-gl.k-gl,html body .k-sal.k-sal{padding:clamp(20px,2.4vw,28px);border-radius:22px}
html body .k-roles.k-roles li{font-size:1.05rem;padding:13px 0}
html body .x-w.x-w,html body .x-path.x-path,html body .t-card.t-card,html body .t-batch.t-batch{padding:24px;border-radius:22px}
html body .t-stat.t-stat{padding:18px 20px;border-radius:18px}
html body .card.card{padding:20px 22px;border-radius:20px}
html body .x-rv.x-rv{padding:20px;border-radius:20px}
html body .c-way.c-way{padding:22px;border-radius:22px}
html body .nv-row.nv-row{padding:18px 20px;border-radius:18px}
html body .nv-st.nv-st{padding:20px;border-radius:18px}
html body .nv-e.nv-e,html body .kd-c.kd-c,html body .tk-c.tk-c{padding:24px;border-radius:22px}
html body .kd-c.kd-c h3{font-size:1.35rem}
html body .cz.cz{padding:14px 16px;border-radius:16px;font-size:.98rem}
html body .st-c.st-c{padding:22px;border-radius:22px}
html body .wl-c.wl-c{padding:20px;border-radius:18px}
html body .pk.pk{padding:24px;border-radius:22px}
html body .pk.pk .pr{font-size:3rem}
html body .fr-st.fr-st{padding:18px 22px;border-radius:20px}
html body .in-c.in-c{padding:22px;border-radius:22px}
html body .bl-c.bl-c .tx{padding:20px 22px 22px}
html body .stk-t.stk-t{width:120px;height:104px;gap:10px}
html body .stk-t.stk-t img{width:38px;height:38px}
/* ---- light cards: tint + accent border on hover ---- */
html body :is(.k-mod,.k-learn,.k-aud,.k-proj,.k-cert,.k-lv,.t-month,.ct-c,.k-fact,.k-roles,.k-gl,.x-w,.x-path,.t-card,.t-batch,.t-stat,.card,.x-rv,.c-way,.nv-row,.nv-st,.nv-e,.kd-c,.cz,.st-c,.wl-c,.pk,.fr-st,.in-c,.bl-c,.tk-c,.stk-t,.partner-cat):not(.k-mod--ink,.t-month--ink,.k-lv--ink,.ct-hl,.k-fact--ink,.pk--hl,.fr-st--hl,.k-cert--hl,.nv-st--hl){transition:background-color .35s ease,border-color .35s ease,transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s ease}
html body :is(.k-mod,.k-learn,.k-aud,.k-proj,.k-cert,.k-lv,.t-month,.ct-c,.k-fact,.k-roles,.k-gl,.x-w,.x-path,.t-card,.t-batch,.t-stat,.card,.x-rv,.c-way,.nv-row,.nv-st,.nv-e,.kd-c,.cz,.st-c,.wl-c,.pk,.fr-st,.in-c,.bl-c,.tk-c,.stk-t,.partner-cat):not(.k-mod--ink,.t-month--ink,.k-lv--ink,.ct-hl,.k-fact--ink,.pk--hl,.fr-st--hl,.k-cert--hl,.nv-st--hl):hover{background-color:color-mix(in srgb,var(--ac,#F5A623) 9%,#fff);border-color:color-mix(in srgb,var(--ac,#F5A623) 45%,#fff)}
/* ---- dark cards: shift toward the accent on hover ---- */
html body :is(.k-mod--ink,.t-month--ink,.k-lv--ink,.ct-hl,.k-fact--ink,.pk--hl,.fr-st--hl,.k-sal){transition:background-color .35s ease,transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s ease}
html body :is(.k-mod--ink,.t-month--ink,.k-lv--ink,.ct-hl,.k-fact--ink,.pk--hl,.fr-st--hl,.k-sal):hover{background-color:color-mix(in srgb,var(--ac,#F5A623) 26%,#0A1422)}
html body :is(.k-cert--hl,.nv-st--hl){transition:background-color .35s ease}
html body :is(.k-cert--hl,.nv-st--hl):hover{background-color:#FFB635}
/* ---- buttons: colour swap on hover ---- */
html body .x-btn{transition:background-color .25s ease,color .25s ease,border-color .25s ease,transform .25s ease,box-shadow .25s ease}
html body .x-btn--ink:hover{background:var(--amber,#F5A623);color:var(--ink,#0A1422)}
html body .x-btn--amber:hover{background:var(--ink,#0A1422);color:#fff;box-shadow:0 12px 28px -12px rgba(10,20,34,.6)}
html body .x-btn--ghost:hover{background:var(--ink,#0A1422);color:#fff;border-color:var(--ink,#0A1422)}
html body .x-btn--line:hover{background:#fff;color:var(--ink,#0A1422);border-color:#fff}
html body .x-btn:hover .x-ico{color:inherit}
/* ---- pill chips: fill with the page colour on hover ---- */
html body :is(.k-glob span,.k-meta span,.k-chip,.k-lv .rl span,.fsx-tags span,.tl,.pin,.time){transition:background-color .25s ease,color .25s ease,border-color .25s ease,transform .25s ease,box-shadow .25s ease;cursor:default}
html body :is(.k-glob span,.k-meta span,.k-chip,.k-lv:not(.k-lv--ink) .rl span,.fsx-tags span,.tl,.pin):hover{background:var(--ac,#F5A623);border-color:var(--ac,#F5A623);color:#fff;transform:translateY(-2px);box-shadow:0 10px 22px -12px color-mix(in srgb,var(--ac,#F5A623) 70%,transparent)}
html body :is(.k-glob span,.k-meta span,.k-chip,.tl,.pin):hover .x-ico,html body :is(.k-glob span,.k-meta span,.tl):hover svg{color:#fff;stroke:currentColor}
html body .k-chip:hover i{background:#fff}
html body .k-lv--ink .rl span:hover{background:#fff;color:var(--ink,#0A1422)}
@media (max-width:640px){html body .stk-t.stk-t{width:calc(33.333% - 7px);height:96px}}
@media (prefers-reduced-motion:reduce){html body .x-btn,html body :is(.k-mod,.k-learn,.k-aud,.k-proj,.t-month,.ct-c){transition:none}}
</style>
<!-- BBT-CARDS:END -->
