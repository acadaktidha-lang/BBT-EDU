<style>
.x-bot{position:fixed;left:0;top:0;width:56px;height:56px;pointer-events:none;z-index:2147483647;opacity:0;transition:opacity .3s;will-change:transform}
.x-bot.on{opacity:1}
.x-bot svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 10px rgba(10,20,34,.28));transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.x-bot .eyes{transition:transform .15s}
.x-bot .eye{fill:#7FE3FF;transform-box:fill-box;transform-origin:center;animation:x-blink 4.2s infinite}
.x-bot .happy{opacity:0;stroke:#7FE3FF;stroke-width:2.2;fill:none;stroke-linecap:round}
.x-bot .bulb{fill:#F5A623}
.x-bot.big .eye{opacity:0}.x-bot.big .happy{opacity:1}
.x-bot.big .bulb{animation:x-pulse .7s ease-in-out infinite alternate}
.x-bot.big svg{transform:scale(1.15)}
.x-bot.down svg{transform:scale(.9)}
@keyframes x-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes x-pulse{from{fill:#F5A623}to{fill:#FFE08A}}
html.x-bot-on,html.x-bot-on *{cursor:none!important}
html.x-bot-on input:not([type=submit]):not([type=button]):not([type=checkbox]):not([type=radio]),html.x-bot-on textarea,html.x-bot-on select,html.x-bot-on [contenteditable]{cursor:auto!important}
.x-bot.txt{opacity:0}
html.x-bot-on .mwai-window-box,html.x-bot-on .mwai-window-box *{cursor:auto!important}
html.x-bot-on .mwai-window-box :is(button,a,[role=button],.mwai-close-button,.mwai-close-button *){cursor:pointer!important}
.x-bot svg{transform-origin:50% 9%}
@media (hover:none),(pointer:coarse){.x-bot{display:none}}
@media (prefers-reduced-motion:reduce){.x-bot .eye,.x-bot.big .bulb{animation:none}}
</style>
<div class="x-bot" aria-hidden="true"><svg viewBox="0 0 48 48">

  <rect x="8" y="10.5" width="32" height="25" rx="9" fill="#0A1422"/>

  <g class="eyes"><circle class="eye" cx="19" cy="22.5" r="2.8"/><circle class="eye" cx="29" cy="22.5" r="2.8"/>
    <path class="happy" d="M16.5 23.5q2.5-3 5 0M26.5 23.5q2.5-3 5 0"/></g>

</svg></div>
<script>
(function(){if(!matchMedia('(hover:hover) and (pointer:fine)').matches)return;var b=document.querySelector('.x-bot');if(!b)return;
var eyes=b.querySelector('.eyes'),still=matchMedia('(prefers-reduced-motion: reduce)').matches,root=document.documentElement,px=0,py=0,tilt=0,raf=0,x=-200,y=-200;
var W=56,HX=W*24/48,HY=W*4.5/48; /* antenna tip = click point */
function draw(){raf=0;b.style.transform='translate3d('+(x-HX)+'px,'+(y-HY)+'px,0) rotate('+tilt+'deg)'}
document.addEventListener('mousemove',function(e){var dx=e.clientX-px,dy=e.clientY-py;px=x=e.clientX;py=y=e.clientY;
 if(!still){tilt+=(Math.max(-14,Math.min(14,dx*1.2))-tilt)*.35;eyes.style.transform='translate('+Math.max(-2.2,Math.min(2.2,dx*.5))+'px,'+Math.max(-1.6,Math.min(1.6,dy*.4))+'px)'}
 b.classList.add('on');root.classList.add('x-bot-on');if(!raf)raf=requestAnimationFrame(draw);
 clearTimeout(b._t);b._t=setTimeout(function(){tilt=0;eyes.style.transform='';if(!raf)raf=requestAnimationFrame(draw)},140)},{passive:true});
document.addEventListener('mouseout',function(e){if(!e.relatedTarget){b.classList.remove('on')}});

 b.classList.toggle('txt',!!t.closest('input:not([type=submit]):not([type=button]):not([type=checkbox]):not([type=radio]),textarea,select,[contenteditable],iframe,.mwai-window-box'));
 b.classList.toggle('big',!!t.closest('a,button,summary,[role=tab],label,input[type=submit],input[type=button]'))});
document.addEventListener('mousedown',function(){b.classList.add('down')});document.addEventListener('mouseup',function(){b.classList.remove('down')});})();
</script>
